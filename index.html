<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tap Empire</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="toastBox"></div>

<div id="particles"></div>



<div class="container">


<header>

<h1>👑 Tap Empire</h1>

<p>امپراتوری سکه خودت را بساز</p>

</header>




<div class="stats">


<div class="card">
🪙 سکه
<strong id="coins">0</strong>
</div>


<div class="card">
🏆 رکورد
<strong id="best">0</strong>
</div>


<div class="card">
⚡ قدرت
<strong id="power">1</strong>
</div>


<div class="card">
🤖 خودکار
<strong id="auto">0</strong>
</div>


</div>





<div class="coin-area">


<button id="coinButton">

<span id="coinIcon">🪙</span>

</button>


<p>
هر کلیک:
<span id="clickPowerText">+1</span>
</p>


<div class="combo">

🔥 کمبو:
<b id="combo">0</b>

ضریب:
<b id="multiplier">x1</b>

</div>


</div>







<nav>


<button data-page="home">
🏠 خانه
</button>


<button data-page="shop">
🛒 فروشگاه
</button>


<button data-page="missions">
🎯 مأموریت
</button>


<button data-page="daily">
🎁 جایزه
</button>


<button data-page="level">
👑 سطح
</button>


<button data-page="skins">
🎨 اسکین
</button>


<button data-page="more">
⚙️ بیشتر
</button>


</nav>







<section id="home" class="page active">


<h2>🏠 خانه</h2>


<div class="box">


<p>
قدرت کلیک:
<span id="homePower">1</span>
</p>


<p>
درآمد خودکار:
<span id="homeAuto">0</span>
</p>


</div>


</section>







<section id="shop" class="page">


<h2>🛒 فروشگاه</h2>



<div class="box">


<button id="powerUpgrade">

ارتقای قدرت کلیک

<br>

قیمت:
<span id="powerCost">100</span>
🪙

</button>




<button id="autoUpgrade">

ارتقای درآمد خودکار

<br>

قیمت:
<span id="autoCost">250</span>
🪙

</button>



</div>


</section>








<section id="missions" class="page">


<h2>🎯 مأموریت‌ها</h2>


<div id="missionList"></div>


</section>








<section id="daily" class="page">


<h2>🎁 جایزه روزانه</h2>


<div class="box">


<p id="dailyText">

جایزه آماده است

</p>



<button id="dailyButton">

دریافت جایزه

</button>


</div>


</section>







<section id="level" class="page">


<h2>👑 سطح</h2>


<div class="box">


<p>

سطح:
<b id="levelValue">1</b>

</p>



<p>

XP:

<span id="xpValue">0</span>

/

<span id="xpNeed">100</span>

</p>



<div class="bar">

<div id="xpBar"></div>

</div>


</div>


</section>







<section id="skins" class="page">


<h2>🎨 اسکین‌ها</h2>


<div id="skinList"></div>


</section>







<section id="more" class="page">


<h2>⚙️ بیشتر</h2>


<div class="box">


<button id="saveButton">

💾 ذخیره

</button>



<button id="resetButton">

🔄 شروع دوباره

</button>



<button id="rubikaButton">

📢 روبیکا

</button>



<button id="supportButton">

❤️ حمایت

</button>



</div>


</section>






</div>





<script src="game.js"></script>


</body>

</html>
