<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Tap Empire - Offline
    </title>


    <style>

        *{

            box-sizing:border-box;

            margin:0;

            padding:0;

        }


        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:#0f172a;

            color:white;

            font-family:
            Tahoma,Arial,sans-serif;

            text-align:center;

            padding:20px;

        }


        .box{

            background:#1e293b;

            border:1px solid #334155;

            border-radius:25px;

            padding:35px 25px;

            max-width:400px;

            width:100%;

        }


        .icon{

            font-size:80px;

            margin-bottom:20px;

        }


        h1{

            font-size:28px;

            margin-bottom:15px;

        }


        p{

            color:#cbd5e1;

            line-height:2;

            font-size:15px;

        }


        button{

            margin-top:25px;

            width:100%;

            padding:14px;

            border:none;

            border-radius:15px;

            background:#475569;

            color:white;

            font-size:16px;

            cursor:pointer;

        }


        button:active{

            transform:scale(.96);

        }


    </style>

</head>


<body>


<div class="box">


    <div class="icon">

        📡

    </div>


    <h1>

        اتصال قطع است

    </h1>


    <p>

        اینترنت شما قطع شده است.

        <br>

        نگران نباش!

        <br>

        پیشرفت بازی روی دستگاه شما ذخیره شده.

    </p>



    <button

    onclick="location.reload()">

        🔄 تلاش دوباره

    </button>


</div>


</body>

</html>
